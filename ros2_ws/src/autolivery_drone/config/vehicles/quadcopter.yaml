# X500-class quadcopter, 1 kg parcel, hover-and-release.
# Tuned against PX4 SITL gz_x500 (SYS_AUTOSTART 4001) with stock multicopter parameters:
# MPC_XY_VEL_MAX 12, MPC_Z_VEL_MAX_UP 3, MPC_Z_VEL_MAX_DN 1.5, MPC_ACC_HOR 3.
/**:
  ros__parameters:
    vehicle:
      name: quadcopter
      class: multicopter
      dropoff_method: hover
      cruise_speed: 8.0
      max_speed: 12.0
      min_speed: 0.0
      max_climb_rate: 3.0
      max_descent_rate: 1.5
      max_acceleration: 3.0
      cruise_altitude: 40.0
      takeoff_altitude: 10.0
      body_radius: 0.6
      planning_clearance: 4.0
      acceptance_radius: 2.0
      turn_radius: 0.0
      release_altitude: 3.0
      max_payload_kg: 1.0
      max_range: 6000.0
      max_wind: 8.0
      max_gust: 12.0
      max_precipitation: 0.1
      min_temperature: -10.0
      max_temperature: 40.0
      px4_airframe: 4001
      sim_model: x500
