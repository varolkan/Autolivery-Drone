# Octocopter (PX4 8001 Generic Octo X), heavy parcels up to 6 kg. Lands to deliver:
# a 6 kg drop from even a few metres is not a delivery.
/**:
  ros__parameters:
    vehicle:
      name: octocopter
      class: multicopter
      dropoff_method: land
      cruise_speed: 9.0
      max_speed: 12.0
      min_speed: 0.0
      max_climb_rate: 2.5
      max_descent_rate: 1.2
      max_acceleration: 2.0
      cruise_altitude: 45.0
      takeoff_altitude: 10.0
      body_radius: 1.1
      planning_clearance: 6.0
      acceptance_radius: 2.0
      turn_radius: 0.0
      release_altitude: 3.0
      max_payload_kg: 6.0
      max_range: 7000.0
      px4_airframe: 8001
      sim_model: ""
