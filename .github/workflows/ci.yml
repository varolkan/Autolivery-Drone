# Build and test the ROS 2 workspace on every push and pull request.
#
# Runs everything that does not need PX4 or a GPU: the core unit and mission-scenario
# tests, the city map / profile checks, the Gazebo world consistency tests, and the dry-run
# launch tests that fly whole deliveries through the ROS graph against the fake FCU.
# PX4 SITL flights are run locally (see README, "Simulation").

name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros2_ws/src --ignore-src -y --rosdistro jazzy

      - name: Build
        working-directory: ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Test
        working-directory: ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          # Launch tests bring up real DDS participants; keep them off other jobs' domain.
          export ROS_DOMAIN_ID=$(( RANDOM % 90 + 10 ))
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ros2_ws/build/*/test_results
